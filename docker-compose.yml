services:
  # ==============================================================
  # BASE DE DATOS POSTGRESQL (Catálogo, Órdenes, Auditoría, Reportes)
  # ==============================================================
  postgres-db:
    image: postgres:16-alpine
    container_name: pedidos360-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - pedidos360-net
    restart: unless-stopped

  # ==============================================================
  # INFRAESTRUCTURA DE STREAMING - APACHE KAFKA & ZOOKEEPER
  # ==============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: pedidos360-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - pedidos360-net
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pedidos360-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://${KAFKA_HOST:-localhost}:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - pedidos360-net
    restart: unless-stopped

  kafka-init-topics:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pedidos360-kafka-init-topics
    depends_on:
      - kafka
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      echo 'Esperando a que Kafka inicie...'
      cub kafka-ready -b kafka:9092 1 40

      echo 'Creando tópicos de la evaluación...'
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic orders.events --config cleanup.policy=delete --config retention.ms=604800000
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic audit.timeline --config cleanup.policy=compact,delete --config retention.ms=2592000000
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic orders.events.DLT --config cleanup.policy=delete --config retention.ms=1209600000
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic audit.timeline.DLT --config cleanup.policy=delete --config retention.ms=1209600000

      echo 'Tópicos creados exitosamente:'
      kafka-topics --list --bootstrap-server kafka:9092
      "
    networks:
      - pedidos360-net

  # ==============================================================
  # MICROSERVICIOS DE NEGOCIO
  # ==============================================================

  # Microservicio de Catálogo de Productos
  ms-catalog:
    build:
      context: ./ms-pedidos360-catalog
      dockerfile: Dockerfile
    container_name: pedidos360-catalog
    ports:
      - "8086:8086"
    environment:
      - PORT=8086
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=pedidos360_catalog
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_SSLMODE=disable
      - RABBITMQ_HOST=${RABBITMQ_HOST:-127.0.0.1}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
    depends_on:
      - postgres-db
    networks:
      - pedidos360-net
    restart: unless-stopped

  # Microservicio de Órdenes / Pedidos
  ms-orders:
    build:
      context: ./ms-pedidos360-orders
      dockerfile: Dockerfile
    container_name: pedidos360-orders
    ports:
      - "8087:8087"
    environment:
      - PORT=8087
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=pedidos360_orders
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_SSLMODE=disable
      - RABBITMQ_HOST=${RABBITMQ_HOST:-127.0.0.1}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    depends_on:
      - postgres-db
      - kafka
    networks:
      - pedidos360-net
    restart: unless-stopped

  # Microservicio de Notificaciones (RabbitMQ -> Gmail SMTP)
  ms-notify:
    build:
      context: ./ms-pedidos360-notify
      dockerfile: Dockerfile
    container_name: pedidos360-notify
    environment:
      - RABBITMQ_HOST=${RABBITMQ_HOST:-127.0.0.1}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_AUTH=${SMTP_AUTH:-true}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      - MAIL_FROM=${MAIL_FROM:-${SMTP_USERNAME}}
      - MAIL_SENDER_NAME=${MAIL_SENDER_NAME:-Pedidos360}
    networks:
      - pedidos360-net
    restart: unless-stopped

  # Microservicio de Auditoría (Kafka Consumer & Timeline API)
  ms-audit:
    build:
      context: ./ms-pedidos360-audit
      dockerfile: Dockerfile
    container_name: pedidos360-audit
    ports:
      - "8089:8089"
    environment:
      - PORT=8089
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=pedidos360_audit
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_SSLMODE=disable
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    depends_on:
      - postgres-db
      - kafka
    networks:
      - pedidos360-net
    restart: unless-stopped

  # Microservicio de Reportería y KPIs (Kafka Consumer & KPI Charts API)
  ms-report:
    build:
      context: ./ms-pedidos360-report
      dockerfile: Dockerfile
    container_name: pedidos360-report
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=pedidos360_report
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_SSLMODE=disable
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    depends_on:
      - postgres-db
      - kafka
    networks:
      - pedidos360-net
    restart: unless-stopped

  # ==============================================================
  # BFF (Backend For Frontend) - API Gateway / Orquestador
  # ==============================================================
  bff-api:
    build:
      context: ./api_cloud
      dockerfile: Dockerfile
    container_name: bff-api
    ports:
      - "8088:8088"
    environment:
      - ENTRA_ISSUER_URI=${ENTRA_ISSUER_URI:-https://login.microsoftonline.com/7787491b-efe4-4871-852a-79e07b048a5a/v2.0}
      - ENTRA_API_CLIENT_ID=${ENTRA_API_CLIENT_ID:-954079da-4c93-427f-9260-62b0e83029bf}
      - SECURITY_ENABLED=${SECURITY_ENABLED:-false}
      - ORDERS_SERVICE_URL=http://ms-orders:8087
      - MICROSERVICE_BASE_URL=http://ms-orders:8087
      - CATALOG_SERVICE_URL=http://ms-catalog:8086
      - AUDIT_SERVICE_URL=http://ms-audit:8089
      - REPORT_SERVICE_URL=http://ms-report:8090
    depends_on:
      - ms-orders
      - ms-catalog
      - ms-audit
      - ms-report
    networks:
      - pedidos360-net
    restart: unless-stopped

volumes:
  pgdata:
  zookeeper_data:
  zookeeper_log:
  kafka_data:

networks:
  pedidos360-net:
    driver: bridge
